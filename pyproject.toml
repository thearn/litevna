[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litevna"
version = "0.1.0"
description = "LiteVNA (NanoVNA V2 protocol) capture, SOL calibration, Touchstone captures and model comparison"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyserial>=3.5", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
litevna = "litevna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src first: a worktree's tests import its own code ahead of the editable install's (which names the main checkout)
pythonpath = ["src"]
testpaths = ["tests"]

[tool.structure]
package = "src/litevna"
mode = "gate"

# The landing gate (lib/git-hooks: git land, quality/gate.py): main moves only through git land; every rule absolute
[tool.quality]
typecheck = "absolute"
package = "src/litevna"
python = "~/.venvs/litevna/bin/python"
absolute = ["function_size", "function_complexity", "function_parameters", "module_size", "duplicate", "pass_through", "noqa"]
