[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litevna"
version = "0.1.0"
description = "LiteVNA (NanoVNA V2 protocol) capture, SOL calibration, Touchstone captures and model comparison"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyserial>=3.5", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
litevna = "litevna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
